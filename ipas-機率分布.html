<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機率分布 · ML Yakiniku</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; font-family: sans-serif; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1.2rem;
      background: #1a1a2e;
      border-bottom: 1px solid rgba(255,69,0,0.3);
    }
    .top-bar h1 { font-size: 0.9rem; color: #FFD700; letter-spacing: 0.1em; font-weight: 600; }
    .back-btn {
      font-size: 0.8rem; color: #8888aa; text-decoration: none;
      border: 1px solid rgba(255,255,255,0.15); padding: 0.2rem 0.7rem;
      border-radius: 4px; transition: color 0.2s;
    }
    .back-btn:hover { color: #fff; }
    .pdf-wrap { height: calc(100vh - 44px); }
    embed { width: 100%; height: 100%; display: block; }
    .fallback {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #8888aa; gap: 1rem;
    }
    .dl-btn {
      display: inline-block; padding: 0.6rem 1.4rem;
      background: #FF4500; color: #fff; border-radius: 6px;
      text-decoration: none; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>⬡ iPAS 備考 &rsaquo; 機率分布 · ML Yakiniku</h1>
    <a class="back-btn" href="/">← 返回首頁</a>
  </div>
  <div class="pdf-wrap">
    <embed src="ipas-機率分布.pdf" type="application/pdf" width="100%" height="100%"
           onerror="document.querySelector('.pdf-wrap').style.display='none';document.querySelector('.fallback').style.display='flex';">
  </div>
  <div class="fallback">
    <p>瀏覽器無法直接顯示 PDF，請點下方下載。</p>
    <a class="dl-btn" href="ipas-機率分布.pdf" download>⬇ 下載 PDF</a>
  </div>
</body>
</html>

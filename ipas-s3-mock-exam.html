<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿森的 iPAS 科目三模擬考</title>
<style>
:root{
  --bg:#14161c; --card:#1b1e26; --line:#3a2f33; --text:#e8e8ec; --mute:#9a9ba6;
  --accent:#f08070; --accent-dim:#3b2420; --ok:#4cc9a0; --ok-bg:#0f2a24; --bad:#f08070; --bad-bg:#3a1f1c; --warn:#f0c060;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;padding:16px}
.wrap{max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:22px 24px;margin-bottom:16px}
.card.plain{border-color:#2c303a}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.clock{font:700 38px/1.1 ui-monospace,Menlo,monospace;letter-spacing:1px}
.mute{color:var(--mute)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tab{background:var(--card);color:var(--text);border:1px solid #3a3d48;border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit}
.tab b{font:500 13px ui-monospace,Menlo,monospace;color:var(--mute);margin-left:4px}
.tab.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
h2{margin:0 0 12px;font-size:26px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mute)}
.chip{border:1px solid #3a3d48;border-radius:6px;padding:0 8px;font-size:13px}
.chip.t{border-color:var(--warn);color:var(--warn)}
.q{font-size:19px;margin:6px 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid #3a3d48;border-radius:8px;padding:12px 14px;margin:0 0 10px;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt .k{font:700 15px ui-monospace,Menlo,monospace;color:var(--mute);min-width:18px}
.opt.sel{border-color:var(--accent);background:var(--accent-dim)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.exp{border:1px solid #4a3f22;background:#221f17;padding:10px 14px;border-radius:4px;margin-top:14px;font-size:15px}
.btn{background:var(--accent);color:#1a0f0d;border:0;border-radius:6px;padding:10px 20px;font:700 16px inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font:800 64px/1 -apple-system,system-ui,sans-serif;color:var(--accent)}
.score small{font:600 24px inherit;margin-left:4px}
.bars{margin:18px 0 8px;display:grid;grid-template-columns:90px 1fr 56px;gap:8px 14px;align-items:center}
.bar{height:12px;border-radius:3px;background:#2d1f1d;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bars .n{text-align:right;font:500 14px ui-monospace,Menlo,monospace}
.gap{grid-column:1/-1;height:6px}
.review a{color:#8b8bff;cursor:pointer;text-decoration:underline;margin:0 2px}
.side{position:sticky;top:12px}
.side h3{margin:0;color:var(--accent);font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.side h3 span{color:var(--text);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cell{position:relative;border:1px solid #1f6a54;background:#0d2a24;color:var(--ok);border-radius:4px;height:40px;font:500 15px ui-monospace,Menlo,monospace;cursor:pointer}
.cell.blank{border-color:#4a4d58;background:#20232b;color:var(--mute)}
.cell.ans{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.cell.bad{border-color:#7a3a30;background:#2b1815;color:var(--bad)}
.cell.cur{outline:2px solid var(--text);outline-offset:1px}
.cell.cur.on-test{outline-color:var(--accent)}
.hint{font-size:14px;color:var(--mute);margin:6px 0}
.list .item{border-top:1px solid #2c303a;padding:14px 0}
.list .item:first-child{border-top:0}
.pill{font:500 13px ui-monospace,Menlo,monospace;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 8px}
.hist{font-size:14px;color:var(--mute)}
input[type=file]{display:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand img{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent)}
.brand b{font-size:20px}.brand small{display:block;color:var(--mute);font-size:13px}
.foot{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--mute);font-size:13px;margin:8px 0 24px;text-align:center}
.foot img{width:28px;height:28px;border-radius:50%}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = [{"id": 1, "ch": 3, "tag": "回馬槍", "code": "L23101-3", "q": "某網站把訪客隨機分成三組，每人只看其中一種廣告版面，想比較三組的平均停留秒數有沒有差異，應選哪種檢定？", "opts": ["單因子 ANOVA", "獨立樣本 t 檢定", "配對 t 檢定", "卡方獨立性檢定"], "ans": 0, "exp": "先數組數：3 組以上→ANOVA；2 組才再分配對／獨立。t 檢定只能比兩組，「每人只看一種」只說明各組獨立。"}, {"id": 2, "ch": 3, "tag": "回馬槍", "code": "L23101-3", "q": "想知道「血型（A／B／O／AB）」與「是否患有某疾病（是／否）」有沒有關聯，兩個變數都是類別，應選哪種檢定？", "opts": ["獨立樣本 t 檢定", "單因子 ANOVA", "配對 t 檢定", "卡方獨立性檢定"], "ans": 3, "exp": "兩個都是分類、算不出平均→卡方；t 檢定與 ANOVA 比的是連續數字的平均。"}, {"id": 3, "ch": 3, "tag": "回馬槍", "code": "L23101-3", "q": "同一批 30 位學生在上課前與上課後各考一次，想比較前後平均分數有沒有進步，應選哪種檢定？", "opts": ["卡方獨立性檢定", "獨立樣本 t 檢定", "配對 t 檢定", "單因子 ANOVA"], "ans": 2, "exp": "關鍵是「同一批人」「前後測」＝配對；依變數是連續分數，所以先排除卡方。"}, {"id": 4, "ch": 3, "tag": "回馬槍", "code": "L23102-6", "q": "在棋盤式街道上只能沿橫直路走，距離等於各座標差的絕對值相加。這是哪一種範數，別名是什麼？", "opts": ["L1 範數，又稱歐幾里得距離", "L2 範數，又稱曼哈頓距離", "L2 範數，又稱歐幾里得距離", "L1 範數，又稱曼哈頓距離"], "ans": 3, "exp": "整串背：L1→一條一條走（絕對值相加）→曼哈頓；L2→平方再開根號→直線→歐幾里得。"}, {"id": 5, "ch": 3, "tag": "回馬槍", "code": "L23102-1", "q": "a = np.array([1,2,3])、b = np.array([4,5,6])，哪一行能算出 a 與 b 的內積（結果為 32）？", "opts": ["a * b", "np.sum(a + b)", "np.dot(a, b)", "np.cross(a, b)"], "ans": 2, "exp": "numpy 的 * 是逐元素相乘，得到 [4, 10, 18]；內積要用 np.dot 或 @。"}, {"id": 6, "ch": 3, "tag": "易混淆", "code": "L23102-4", "q": "對標準化後的資料使用 PCA(n_components=0.95)，這個小數參數代表什麼？", "opts": ["保留累積解釋變異量達 95% 所需的最少主成分數", "只隨機保留 95% 的資料筆數，其餘樣本列直接刪除", "只隨機保留 95% 的原始特徵欄，其餘欄位直接捨棄", "把每個主成分的權重都縮小為原本數值的 95%"], "ans": 0, "exp": "小數＝變異量比例；列數（樣本數）不變，只減少欄位（維度）。"}, {"id": 7, "ch": 3, "tag": "易混淆", "code": "L23101-5", "q": "某疾病盛行率 1%，檢測靈敏度 99%、偽陽性率 5%。一個人檢測為陽性，他真的患病的機率最接近多少？", "opts": ["約 99%", "約 95%", "約 5%", "約 16.7%"], "ans": 3, "exp": "貝氏定理：0.01×0.99 ÷（0.01×0.99＋0.99×0.05）≈ 0.167。盛行率低時，陽性預測值往往遠低於靈敏度。"}, {"id": 8, "ch": 3, "tag": "回馬槍", "code": "L23103-3b", "q": "用 SGD 訓練，學習率設 0.5，損失曲線劇烈震盪、無法收斂，最直接的改善是？", "opts": ["把學習率降到 1e-3 左右", "換成 Adam 優化器就能解決", "把批次大小增加到全部資料", "再多訓練 50 個 epoch"], "ans": 0, "exp": "震盪＝學習率太大，直接降 lr；換 Adam 只是間接改善，沒處理根本原因。"}, {"id": 9, "ch": 3, "tag": "回馬槍", "code": "L23103-2", "q": "訓練 CNN 時，全批次梯度下降穩定但每步太慢，純 SGD（一次一筆）快但損失曲線震盪，折衷作法是？", "opts": ["改用 Mini-batch 梯度下降", "維持純 SGD 並提高學習率", "改回全批次並降低學習率", "把批次大小固定為 1 並增加 epoch"], "ans": 0, "exp": "Mini-batch 兼顧穩定與速度。這組題已累計錯 3 次，優先鞏固。"}, {"id": 10, "ch": 3, "tag": "易混淆", "code": "L23103-1", "q": "下列哪一項是在描述「梯度下降」，而不是「反向傳播」？", "opts": ["從輸出層往輸入層，逐層用鏈鎖法則算出各權重的梯度", "拿算好的梯度，沿反方向調整權重以降低損失", "把預測誤差往回傳，決定每個權重該負多少責任", "先前向計算出損失，再回頭求各層的偏導數"], "ans": 1, "exp": "口訣：先算（反向傳播）、後改（梯度下降）。看題目描述的動作是「算」還是「調整」。"}, {"id": 11, "ch": 4, "tag": "回馬槍", "code": "L23203-1b", "q": "用 Keras 做 4 類互斥分類，損失函數為 CategoricalCrossentropy(from_logits=True)，輸出層應該怎麼寫？", "opts": ["Dense(4, activation='softmax')", "Dense(4, activation='sigmoid')", "Dense(4)，不設激活函數", "Dense(1, activation='sigmoid')"], "ans": 2, "exp": "from_logits=True＝損失函數自己做 Softmax，輸出層要給 logits，再接 softmax 等於做兩次。"}, {"id": 12, "ch": 4, "tag": "回馬槍", "code": "L23203-1b", "q": "胸腔 X 光每張可能同時有 3 種病徵（多標籤），PyTorch 使用 BCEWithLogitsLoss，輸出層怎麼配？", "opts": ["輸出 3 維後接 Softmax 再算損失", "輸出 3 維後接 Sigmoid 再算損失", "輸出 3 維 logits，不再加任何激活函數", "輸出 1 維後接 Sigmoid 再算損失"], "ans": 2, "exp": "多標籤各自是／否，不能用 Softmax；WithLogits 已內建 Sigmoid，連 Sigmoid 都不能再接。"}, {"id": 13, "ch": 4, "tag": "考古題", "code": "L23203-1", "q": "（115-1 改編）三分類任務使用 PyTorch 的 CrossEntropyLoss，最後一層應如何設計？", "opts": ["輸出 3 維後接 Softmax", "輸出 3 維後接 Sigmoid", "輸出 3 維 logits，不加激活", "輸出 1 維後接 ReLU"], "ans": 2, "exp": "CrossEntropyLoss 內建 LogSoftmax＋NLLLoss。名字帶 WithLogits 或 CrossEntropyLoss＝已內建，不能再加。"}, {"id": 14, "ch": 4, "tag": "回馬槍", "code": "L23203-8b", "q": "對手寫數字影像做資料增強時，下列哪一種最不適合？", "opts": ["把影像旋轉 180 度", "輕微調整亮度與對比", "小角度平移或縮放", "加入少量隨機雜訊"], "ans": 0, "exp": "增強不能改變標籤：6 旋轉 180 度會變成 9。亮度與對比是標準增強。"}, {"id": 15, "ch": 4, "tag": "回馬槍", "code": "L23203-9", "q": "輸入為 3 通道，卷積層使用 16 個 3×3 濾波器且含 bias，這一層的參數量是多少？", "opts": ["448", "432", "144", "28"], "ans": 0, "exp": "（核高×核寬×輸入通道＋1）×濾波器數＝（27＋1）×16＝448。別漏掉 bias。"}, {"id": 16, "ch": 4, "tag": "回馬槍", "code": "L23203-6b", "q": "比較 Transformer 與 LSTM，下列哪一項敘述不正確？", "opts": ["自注意力的計算量隨序列長度成平方成長", "Transformer 較容易平行化，訓練通常更快", "Transformer 靠自注意力，因此不需要位置編碼", "LSTM 以閘門機制緩解長距離梯度消失"], "ans": 2, "exp": "Transformer 本身沒有順序概念，一定要加位置編碼。"}, {"id": 17, "ch": 4, "tag": "回馬槍", "code": "L23202-8", "q": "比較 K-means 與 DBSCAN，下列哪一項敘述不正確？", "opts": ["DBSCAN 可以把低密度的點標成雜訊", "K-means 需要事先指定好群數 K", "DBSCAN 能找出各種非球形的群", "密度差很大時，DBSCAN 仍能完美分群"], "ans": 3, "exp": "DBSCAN 用單一 ε，密度不均時很難兼顧。"}, {"id": 18, "ch": 4, "tag": "回馬槍", "code": "L23201-5", "q": "先標準化再做 PCA，正確的流程是？", "opts": ["先切分，只用訓練集 fit 標準化與 PCA，再用同一組參數轉換測試集", "先切分，對測試集 fit 標準化，再轉換訓練集後做 PCA", "先對全部資料標準化與 PCA，再切分訓練與測試", "先切分，訓練集與測試集各自獨立 fit 一組標準化"], "ans": 0, "exp": "誰 fit？只有訓練集。測試集只能 transform，用測試集 fit 也是洩漏。"}, {"id": 19, "ch": 4, "tag": "回馬槍", "code": "L23201-5", "q": "下列哪一種前處理做法會造成資料洩漏？", "opts": ["OneHotEncoder 只在訓練集 fit，再套用到驗證集", "先用全部資料的中位數補缺值，再切分訓練與驗證", "StandardScaler 只用訓練集 fit，再轉換測試集", "訓練集 fit_transform，測試集只做 transform"], "ans": 1, "exp": "測試集數值參與統計量就是洩漏，即使沒用到標籤也一樣。"}, {"id": 20, "ch": 4, "tag": "易混淆", "code": "L23203-3", "q": "某隱藏層有些神經元的輸入長期為負，ReLU 輸出恆為 0、梯度也是 0，這些神經元不再更新。這個現象最可能是？", "opts": ["梯度爆炸", "梯度消失", "過擬合", "Dying ReLU"], "ans": 3, "exp": "Dying ReLU 是單一神經元死掉；梯度消失是多層連乘累積（例如 Sigmoid 兩端平坦），別搞混範圍。"}, {"id": 21, "ch": 4, "tag": "易混淆", "code": "L23203-2", "q": "兩個任務：①預測明日氣溫（連續數值）②判斷郵件是否為垃圾信。損失函數各自較適合？", "opts": ["①Cross-Entropy　②MSE", "①MSE　②MSE", "①Cross-Entropy　②Cross-Entropy", "①MSE　②Cross-Entropy"], "ans": 3, "exp": "看要猜什麼：連續數值→MSE；類別／機率→Cross-Entropy。"}, {"id": 22, "ch": 4, "tag": "易混淆", "code": "L23203-5", "q": "用過去 60 秒的感測器讀數預測下一秒溫度，順序很重要。下列哪種架構與理由最合適？", "opts": ["CNN，因為它專門處理影像空間特徵，不看順序", "全連接網路，因為順序不影響預測結果", "RNN／LSTM，用隱藏狀態保留前後順序資訊", "K-means，先把讀數分群再取各群平均"], "ans": 2, "exp": "看資料型態：圖片、空間→CNN；文字、語音、時間序列→RNN。"}, {"id": 23, "ch": 4, "tag": "易混淆", "code": "L23202-3", "q": "關於集成學習，下列哪一項敘述正確？", "opts": ["隨機森林的每棵樹都專門修正前一棵樹的錯誤", "隨機森林的各棵樹彼此獨立，可以並行訓練", "AdaBoost 的各個弱學習器彼此獨立並行訓練", "Bagging 與 Boosting 都是依序接力訓練"], "ans": 1, "exp": "Bagging 獨立並行（隨機森林）；Boosting 依序接力、修正前面錯誤（AdaBoost／XGBoost）。"}, {"id": 24, "ch": 4, "tag": "指引", "code": "L23202-4", "q": "表格資料競賽中的「常勝軍」：依序建樹、每棵樹修正前面的殘差，精確度通常高於隨機森林。這類方法是？", "opts": ["隨機森林（Bagging）", "K 近鄰（KNN）", "簡單線性迴歸", "梯度提升樹（如 XGBoost）"], "ans": 3, "exp": "指引 ch04：XGBoost 等梯度提升是許多 Kaggle 競賽常勝軍。"}, {"id": 25, "ch": 4, "tag": "指引", "code": "L23203-4", "q": "相較於 Sigmoid，隱藏層常改用 ReLU，主要原因是？", "opts": ["輸出被壓縮在 0 到 1 之間，可直接當機率", "負區間也有很大的梯度，學習得更快", "不需要任何設定，也不會有神經元失效", "正區間梯度恆為 1，較不易梯度消失"], "ans": 3, "exp": "ReLU 正區間導數為 1；負區間導數為 0，才會有 Dying ReLU。"}, {"id": 26, "ch": 4, "tag": "指引", "code": "L23203-9", "q": "關於 CNN 的最大池化層（Max Pooling），下列哪一項正確？", "opts": ["每個濾波器都有獨立權重需要訓練", "會把特徵圖尺寸放大，以保留更多細節", "沒有可學習的參數，會縮小特徵圖的尺寸", "一定要接在輸出層之後才有效"], "ans": 2, "exp": "池化只做取最大值（或平均），不需訓練，用來降維並增加平移不變性。"}, {"id": 27, "ch": 4, "tag": "指引", "code": "L23203-7", "q": "自注意力（Self-Attention）中，序列長度從 512 增加為 1024，注意力矩陣的計算量大約變成幾倍？", "opts": ["約 2 倍", "約 4 倍", "約 8 倍", "幾乎不變"], "ans": 1, "exp": "注意力矩陣是 n×n，長度加倍→計算量為 2²＝4 倍。"}, {"id": 28, "ch": 5, "tag": "回馬槍", "code": "L23301-7", "q": "先對全部資料做 SMOTE，再做 5 折交叉驗證，Recall 達 0.97，上線卻只有 0.55。最可能的原因是？", "opts": ["SMOTE 只能用在測試集，不能用在訓練集", "驗證折的樣本被拿去合成，近似點混進訓練折，分數虛高", "折數太少，應改用留一法才會準", "Recall 本來就不能用在不平衡資料"], "ans": 1, "exp": "驗證折／測試集要保持原比例，只有訓練部分能合成。"}, {"id": 29, "ch": 5, "tag": "回馬槍", "code": "L23301-7", "q": "要在交叉驗證中使用 SMOTE，正確做法是？", "opts": ["把 SMOTE 放進 Pipeline，每折只處理訓練折", "只對測試集做 SMOTE，讓兩類比例平衡", "先對全部資料 SMOTE，再切分訓練與驗證", "驗證折也一起 SMOTE，讓評估結果更穩定"], "ans": 0, "exp": "口訣：考卷不能動，只有課本可以加料。"}, {"id": 30, "ch": 5, "tag": "回馬槍", "code": "L23302-4", "q": "下列何者「不是」AutoML 會自動化的環節？", "opts": ["嘗試多種演算法並比較結果", "自動決定商業問題與成功指標", "自動搜尋超參數組合", "自動產生部分特徵工程步驟"], "ans": 1, "exp": "看到「不是」先圈起來。嘗試多種演算法正是 AutoML 的核心功能；商業問題與指標要由人決定。"}, {"id": 31, "ch": 5, "tag": "考古題", "code": "L23303-2", "q": "（115-1 改編）某肺癌篩檢資料 99% 為正常，模型全猜正常，Accuracy 仍達 99.1%。此評估方式最嚴重的缺陷是？", "opts": ["Accuracy 對類別不平衡不敏感，看不出陽性偵測能力", "資料不含邊界樣本，無法評估決策邊界", "Accuracy 只能用於二元分類，不能多分類", "Accuracy 計算成本過高，不適合大型資料"], "ans": 0, "exp": "全猜正常也有 99%，要看漏診就看 Recall。"}, {"id": 32, "ch": 5, "tag": "回馬槍", "code": "L23303-8b", "q": "Early Stopping 設 patience=3，驗證損失從第 11 個 epoch 起不再改善，訓練會在第幾個 epoch 停止？", "opts": ["第 12 個", "第 14 個", "第 11 個", "第 13 個"], "ans": 3, "exp": "公式：起點＋patience－1＝11＋3－1＝13。從第一次沒進步那格數滿 patience 個。"}, {"id": 33, "ch": 5, "tag": "回馬槍", "code": "L23304-6", "q": "只有 500 張角度相似的影像，訓練準確率 99%、驗證準確率 72%，最合適的對策是？", "opts": ["做資料增強，增加樣本的變化", "加入 L2 正則化，限制特徵權重", "增加網路層數以提升表達力", "延長訓練 epoch 直到驗證準確率上升"], "ans": 0, "exp": "先問「缺什麼」：缺樣本變化→增強；特徵太多→L2；模型太複雜→剪枝／Dropout。"}, {"id": 34, "ch": 5, "tag": "考古題", "code": "L23304-6", "q": "（115-1 改編）模型訓練集 F1=0.96、驗證集 F1=0.71，想降低模型複雜度，哪個策略合適？", "opts": ["引入更多原始特徵", "增加訓練 epoch 數", "加入 L2 權重衰減", "加深網路層數"], "ans": 2, "exp": "加特徵、加 epoch、加深度都讓模型更複雜，只會更過擬合。"}, {"id": 35, "ch": 5, "tag": "回馬槍", "code": "L23304-5", "q": "想把模型中數值接近 0 的權重直接移除，以縮小模型，這是哪一種壓縮技術？", "opts": ["張量分解", "量化（Quantization）", "知識蒸餾", "權重剪枝（Pruning）"], "ans": 3, "exp": "剪枝＝移除；分解＝把矩陣拆成小矩陣；量化＝降位元。"}, {"id": 36, "ch": 5, "tag": "回馬槍", "code": "L23304-5", "q": "比較量化與剪枝，下列哪一項敘述不正確？", "opts": ["量化是降低每個參數所用的位元數", "量化會減少模型的參數個數", "剪枝是移除不重要的權重或連接", "知識蒸餾需要額外訓練一個學生模型"], "ans": 1, "exp": "量化降位元，參數個數不變。"}, {"id": 37, "ch": 5, "tag": "易混淆", "code": "L23302-2", "q": "關於超參數搜尋，下列哪一項敘述正確？", "opts": ["Grid Search 可能漏掉最佳組合，Random Search 不會漏", "兩者都保證找到全域最佳組合", "Random Search 可能漏掉最佳組合，Grid Search 在給定網格內窮舉不會漏", "兩者都只評估少數幾組，必然漏掉最佳解"], "ans": 2, "exp": "已累計 3 次答反：窮舉不會漏，隨機抽才會漏。實務：先 Random 粗調，再 Grid 細調。"}, {"id": 38, "ch": 5, "tag": "易混淆", "code": "L23304-1", "q": "特徵很多，想讓不重要特徵的權重直接變成 0，達到特徵篩選效果，應選？", "opts": ["L2 正則化（Ridge）", "L1 正則化（Lasso）", "Dropout", "資料增強"], "ans": 1, "exp": "L1 能把權重壓到剛好 0 做特徵篩選；L2 只是縮小；Dropout 是訓練時隨機關神經元，不做特徵篩選。"}, {"id": 39, "ch": 5, "tag": "易混淆", "code": "L23303-1", "q": "「模型判斷為陽性的人當中，實際真的陽性的比例」是哪一個指標？", "opts": ["Precision（精確率）", "Recall（召回率）", "Accuracy（準確率）", "Specificity（特異度）"], "ans": 0, "exp": "只看「被判為陽性」那一群→Precision；看全部樣本猜對的比例→Accuracy。"}, {"id": 40, "ch": 5, "tag": "易混淆", "code": "L23303-1", "q": "癌症初篩寧可多抓幾個疑似病例，也不要漏掉真正的病人，最該優先看哪個指標？", "opts": ["Precision（精確率）", "Recall（召回率）", "Accuracy（準確率）", "Specificity（特異度）"], "ans": 1, "exp": "不能漏掉真陽性→看 Recall（真陽性中抓到幾成）。"}, {"id": 41, "ch": 5, "tag": "指引", "code": "L23301-3", "q": "用過去三年每日銷售資料預測未來，交叉驗證應選哪種切分？", "opts": ["KFold 並打亂順序，讓各折分布一致", "TimeSeriesSplit，訓練折永遠在驗證折之前", "StratifiedKFold，依銷售量類別分層", "LeaveOneOut，每次留一天做驗證"], "ans": 1, "exp": "時間序列不能打亂，否則用未來預測過去，等於洩漏。"}, {"id": 42, "ch": 5, "tag": "指引", "code": "L23301-4", "q": "每位病人有多張 X 光影像，若隨機切分，同一病人可能同時出現在訓練與驗證。應使用？", "opts": ["KFold 並打亂順序", "StratifiedKFold，依標籤比例切分", "TimeSeriesSplit，依時間順序切分", "GroupKFold，以病人為單位切分"], "ans": 3, "exp": "同一病人的影像高度相似，跨集合出現會讓分數虛高；要按「組」切。"}, {"id": 43, "ch": 5, "tag": "回馬槍", "code": "L23304-3", "q": "訓練準確率 0.78 低於驗證準確率 0.86，模型使用 Dropout(0.6)，資料已確認無重複與洩漏。最合理的判斷是？", "opts": ["驗證集發生洩漏，應重新切分資料", "模型過擬合，應調高 Dropout 比例", "Dropout 過強造成欠擬合，應調低比例", "驗證集太小，結果沒有參考價值"], "ans": 2, "exp": "Dropout 訓練時開、驗證時關；train<val 且資料乾淨，先想 Dropout 太強。"}, {"id": 44, "ch": 6, "tag": "回馬槍", "code": "L23401-5", "q": "攻擊者手上有一份完整病歷，想知道這份病歷是否曾被用來訓練某醫療模型，這是哪種攻擊？", "opts": ["模型反演攻擊", "資料投毒攻擊", "成員推論攻擊", "對抗樣本攻擊"], "ans": 2, "exp": "看答案形狀：是／否（有沒有在訓練集）→成員推論；一份內容（還原、重建）→模型反演。圈出題目的動詞「有沒有」。"}, {"id": 45, "ch": 6, "tag": "回馬槍", "code": "L23401-5", "q": "攻擊者輸入員工姓名，反覆調整影像讓模型信心提高，最後重建出近似該員工的臉孔。這是哪種攻擊？", "opts": ["模型反演攻擊", "成員推論攻擊", "資料投毒攻擊", "模型竊取攻擊"], "ans": 0, "exp": "重建一份內容→模型反演。別被「員工姓名」帶去聯想成員推論。"}, {"id": 46, "ch": 6, "tag": "回馬槍", "code": "L23402-3", "q": "貸款模型要求「不論申請人是否有還款資格，男女整體核准率一致」，對應哪個公平性指標？", "opts": ["Equal Opportunity（機會均等）", "Equalized Odds（均等化勝算）", "個體公平性（Individual Fairness）", "Demographic Parity（人口統計均等）"], "ans": 3, "exp": "關鍵句「不論資格」＋「整體」→DP；有提到資格者→EO。"}, {"id": 47, "ch": 6, "tag": "回馬槍", "code": "L23402-3", "q": "要求「實際有還款能力的人當中，各族群被核准的比例相同」，對應哪個公平性指標？", "opts": ["Demographic Parity（人口統計均等）", "Equal Opportunity（機會均等）", "Equalized Odds（均等化勝算）", "個體公平性（Individual Fairness）"], "ans": 1, "exp": "條件從哪群人開始算：實際有資格者的核准率（TPR）相同→EO。Equalized Odds 還要求沒資格者的誤判率也相同。"}, {"id": 48, "ch": 6, "tag": "回馬槍", "code": "L23401-2", "q": "保險公司想委託單一第三方雲端，對加密後的保單資料直接運算，且不讓雲端看到明文，應選哪種技術？", "opts": ["聯邦學習", "同態加密", "差分隱私", "資料去識別化"], "ans": 1, "exp": "同態加密＝單一方對加密資料直接運算；聯邦學習＝各方本地訓練、只傳模型參數。"}, {"id": 49, "ch": 6, "tag": "易混淆", "code": "L23402-1", "q": "5 折交叉驗證的平均準確率穩定在 0.91，是否代表模型對不同族群的表現沒有落差？", "opts": ["代表，穩定的整體分數就表示各族群表現一致", "不代表；公平性要另外按族群拆開檢查指標", "代表，只要把折數增加到 10 折就能保證", "不代表；必須改用留一法才能檢查公平性"], "ans": 1, "exp": "交叉驗證解決「分數穩不穩」，公平性檢查「群體有沒有落差」，是兩件平行的事。"}, {"id": 50, "ch": 6, "tag": "指引", "code": "L23401-3", "q": "在查詢結果中加入經過校準的隨機雜訊，使攻擊者難以判斷某個人是否在資料集中。這是哪種技術？", "opts": ["差分隱私", "同態加密", "聯邦學習", "K-匿名化"], "ans": 0, "exp": "差分隱私＝加入校準雜訊，保證單一個人的有無不會明顯改變輸出。"}];

let S = {view:'start', qs:[], ans:{}, submitted:false, cur:0, filter:'全部', t0:0, sec:0, mode:'full'};

function startExam(list, mode){
  S = {view:'exam', qs:list, ans:{}, submitted:false, cur:0, filter:'全部', t0:Date.now(), sec:0, mode};
  clearInterval(timer); timer = setInterval(tick,1000); render();
}
function tick(){
  if(S.view!=='exam'||S.submitted) return;
  S.sec = Math.floor((Date.now()-S.t0)/1000);
  document.querySelectorAll('.js-clock').forEach(e=>e.textContent=fmt(S.sec));
}
function isRight(q,i){ return S.ans[i]===q.ans; }
function stats(){
  const total=S.qs.length; let c=0, blank=0;
  S.qs.forEach((q,i)=>{ if(S.ans[i]===undefined) blank++; else if(isRight(q,i)) c++; });
  return {total,c,blank,wrong:S.qs.map((q,i)=>i).filter(i=>!isRight(S.qs[i],i))};
}
function submit(){
  const st=stats();
  if(st.blank && !confirm('還有 '+st.blank+' 題沒作答，確定要交卷嗎？')) return;
  S.sec = Math.floor((Date.now()-S.t0)/1000);
  S.submitted=true; clearInterval(timer);
  const book=store.get(KEY_BOOK,{}), today=new Date().toISOString().slice(0,10);
  S.qs.forEach((q,i)=>{
    if(isRight(q,i)){ if(S.mode==='redo') delete book[q.id]; }
    else { const b=book[q.id]||{n:0}; b.n++; b.last=today; book[q.id]=b; }
  });
  store.set(KEY_BOOK,book);
  const hist=store.get(KEY_HIST,[]);
  hist.push({d:today,score:Math.round(st.c*100/st.total),c:st.c,total:st.total,sec:S.sec,mode:S.mode});
  store.set(KEY_HIST,hist.slice(-30));
  S.showScore=true; S.cur=st.wrong.length?st.wrong[0]:0; render(); window.scrollTo(0,0);
}
function visible(){
  return S.qs.map((q,i)=>i).filter(i=>S.filter==='全部'||S.qs[i].tag===S.filter);
}
function go(i){ S.cur=i; render(); }
function move(d){
  const v=visible(); if(!v.length) return;
  let p=v.indexOf(S.cur); p = p<0 ? 0 : Math.min(v.length-1,Math.max(0,p+d)); S.cur=v[p]; render();
}
function pick(k){
  if(S.submitted) return; S.ans[S.cur]=k; render();
}

function footHTML(){
  return `<div class="foot"><img src="${MASCOT}" alt=""><span>題目與解析由阿森整理編寫，僅供學習使用　<a href="${BLOG}" target="_blank" rel="noopener">阿森的部落格</a></span></div>`;
}
function render(){
  const app=document.getElementById('app');
  if(S.view==='start') app.innerHTML=startHTML();
  else if(S.view==='book') app.innerHTML=bookHTML();
  else app.innerHTML=examHTML();
  app.insertAdjacentHTML('beforeend',footHTML());
}

function startHTML(){
  const book=store.get(KEY_BOOK,{}), n=Object.keys(book).length, hist=store.get(KEY_HIST,[]);
  const h = hist.slice(-5).reverse().map(x=>`<div>${x.d}　${x.score} 分（${x.c}/${x.total}）　${fmt(x.sec)}　${x.mode==='redo'?'錯題重做':'整份'}</div>`).join('');
  return `<div class="card"><div class="brand"><img src="${MASCOT}" alt="阿森的哥吉拉"><div><b>阿森</b><small>職安衛 × 流程自動化 × AI 學習</small></div></div><h2>iPAS AI 規劃師中級　科目三 模擬考</h2>
  <p class="mute">試做版：50 題單選，答完交卷後看成績、各章與各題型的對錯，答錯的自動進錯題本。成績和錯題本只存在這台裝置的瀏覽器裡。</p>
  <p>第 3～6 章　<b>回馬槍</b>＝你答錯過的題型　<b>易混淆</b>＝兩兩相似的概念　<b>考古題</b>＝115-1 改編　<b>指引</b>＝指引重點</p>
  <div class="row"><button class="btn" data-a="start">開始作答（50 題）</button>
  <button class="btn ghost" data-a="book">錯題本（${n} 題）</button></div>
  ${h?`<div class="hist" style="margin-top:18px"><b>最近成績</b>${h}</div>`:''}</div>`;
}

function tabsHTML(){
  const all=['全部',...TAGS];
  return `<div class="tabs">`+all.map(t=>{
    const c = t==='全部'?S.qs.length:S.qs.filter(q=>q.tag===t).length;
    if(!c) return '';
    return `<button class="tab ${S.filter===t?'on':''}" data-a="filter" data-v="${t}">${t}<b>${c}</b></button>`;
  }).join('')+`</div>`;
}

function barRows(items){
  return items.map(it=>`<div>${esc(it.label)}</div><div class="bar"><i style="width:${it.t?it.c*100/it.t:0}%"></i></div><div class="n">${it.c}/${it.t}</div>`).join('');
}
function scoreHTML(){
  const st=stats(), pts=100/st.total, score=Math.round(st.c*pts);
  const chItems=CHS.map(ch=>{ const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].ch===ch); return {label:'第 '+ch+' 章',t:idx.length,c:idx.filter(i=>isRight(S.qs[i],i)).length}; }).filter(x=>x.t);
  const tgItems=TAGS.map(tg=>{ const idx=S.qs.map((q,i)=>i).filter(i=>S.qs[i].tag===tg); return {label:tg,t:idx.length,c:idx.filter(i=>isRight(S.qs[i],i)).length}; }).filter(x=>x.t);
  const book=store.get(KEY_BOOK,{}), n=Object.keys(book).length;
  const links=st.wrong.map(i=>`<a data-a="go" data-v="${i}">${i+1}</a>`).join('、');
  return `<div class="card"><h2>考試成績</h2>
   <div class="score">${score}<small>分</small> <span class="mute" style="font-size:15px;font-weight:400">（${st.c}/${st.total} 題，每題 ${pts%1?pts.toFixed(1):pts} 分；未作答 ${st.blank} 題；作答時間 ${fmt(S.sec)}）</span></div>
   <div class="bars">${barRows(chItems)}<div class="gap"></div>${barRows(tgItems)}</div>
   ${st.wrong.length?`<div class="review mute">要回頭看的題號：${links}</div>`:'<div class="review" style="color:var(--ok)">全部答對！</div>'}
   <div class="row"><button class="btn" data-a="redo" ${n?'':'disabled'}>去錯題本重做（${n} 題）</button>
   <button class="btn ghost" data-a="start">再考一次</button><button class="btn ghost" data-a="home">回首頁</button></div></div>`;
}

function examHTML(){
  const q=S.qs[S.cur], st=stats(), done=Object.keys(S.ans).length;
  const status = S.submitted ? '已交卷，作答時間' : `作答中 · 已答 ${done}/${S.qs.length}`;
  const v=visible();
  const cells=v.map(i=>{
    let c='cell blank';
    if(S.submitted) c='cell '+(isRight(S.qs[i],i)?'':'bad');
    else if(S.ans[i]!==undefined) c='cell ans';
    return `<button class="${c} ${i===S.cur?'cur':''}" data-a="go" data-v="${i}">${i+1}</button>`;
  }).join('');
  const opts=q.opts.map((o,k)=>{
    let c='opt';
    if(S.submitted){ if(k===q.ans) c+=' right'; else if(S.ans[S.cur]===k) c+=' wrong'; }
    else if(S.ans[S.cur]===k) c+=' sel';
    return `<button class="${c}" data-a="pick" data-v="${k}" ${S.submitted?'disabled':''}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const mine = S.ans[S.cur];
  const verdict = S.submitted ? (mine===undefined?'<span class="pill">未作答</span>':(mine===q.ans?'<span class="pill" style="color:var(--ok);border-color:var(--ok)">答對</span>':'<span class="pill">答錯</span>')) : '';
  const left = (S.submitted&&S.showScore?scoreHTML():'')+`<div class="card plain">
    <div class="meta"><b>第 ${S.cur+1} 題</b><span class="chip">第 ${q.ch} 章</span><span class="chip t">${q.tag}</span><span>${q.code}</span>${verdict}</div>
    <div class="q">${esc(q.q)}</div>${opts}
    ${S.submitted?`<div class="exp"><b>答案 ${L[q.ans]}</b>　${esc(q.exp)}</div>`:''}
    <div class="row"><button class="btn ghost" data-a="prev">← 上一題</button><button class="btn ghost" data-a="next">下一題 →</button>
    ${S.submitted?'':'<button class="btn" data-a="submit">交卷</button>'}</div></div>`;
  const right = `<div class="card side"><h3>劃記卡<span>${S.submitted?`${st.c} 對／已答 ${done}`:`已答 ${done}／${S.qs.length}`}</span></h3>
    <p><b>作答時間</b>　<b class="js-clock" style="font-family:ui-monospace,Menlo,monospace">${fmt(S.sec)}</b></p>
    <div class="grid">${cells}</div>
    <div class="hint">點格子跳到該題<br>鍵盤：← → 換題，A～D 作答</div>
    <div class="row"><button class="btn ghost" data-a="clear" ${S.submitted?'disabled':''}>清除作答</button><button class="btn ghost" data-a="home">離開</button></div></div>`;
  return `<div class="card top"><div class="clock js-clock">${fmt(S.sec)}</div><span class="mute">${status}</span></div>${tabsHTML()}<div class="layout"><div>${left}</div>${right}</div>`;
}

function bookHTML(){
  const book=store.get(KEY_BOOK,{}), ids=Object.keys(book).map(Number);
  const items=ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean).sort((a,b)=>book[b.id].n-book[a.id].n);
  const list=items.map(q=>`<div class="item"><div class="meta"><span class="pill">錯 ${book[q.id].n} 次</span><span class="chip">第 ${q.ch} 章</span><span class="chip t">${q.tag}</span><span>${q.code}　最近：${book[q.id].last}</span></div>
   <div>${esc(q.q)}</div><div style="color:var(--ok);margin-top:6px">答案：${L[q.ans]}. ${esc(q.opts[q.ans])}</div><div class="exp">${esc(q.exp)}</div></div>`).join('');
  return `<div class="card"><h2>錯題本（${items.length} 題）</h2>
   <div class="row" style="margin:0 0 12px"><button class="btn" data-a="redo" ${items.length?'':'disabled'}>重做這些題</button>
   <button class="btn ghost" data-a="export">匯出成績檔</button><button class="btn ghost" data-a="import">匯入成績檔</button>
   <button class="btn ghost" data-a="wipe">清空錯題本</button><button class="btn ghost" data-a="home">回首頁</button></div>
   <input type="file" id="file" accept="application/json">
   <p class="hint">答對一次重做題，該題就會移出錯題本。換裝置時，用「匯出／匯入成績檔」搬記錄。</p>
   <div class="list">${list||'<p class="mute">目前沒有錯題。</p>'}</div></div>`;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==='start') startExam(Q.slice(),'full');
  else if(a==='home'){ if(S.view==='exam'&&!S.submitted&&!confirm('離開會放棄目前作答，確定嗎？')) return; clearInterval(timer); S.view='start'; render(); }
  else if(a==='book'){ S.view='book'; render(); }
  else if(a==='redo'){
    const book=store.get(KEY_BOOK,{}), list=Q.filter(q=>book[q.id]);
    if(list.length) startExam(list,'redo');
  }
  else if(a==='filter'){ S.filter=v; const vis=visible(); if(vis.length&&!vis.includes(S.cur)) S.cur=vis[0]; render(); }
  else if(a==='go'){ go(+v); if(S.submitted) window.scrollTo(0,0); }
  else if(a==='pick') pick(+v);
  else if(a==='prev') move(-1);
  else if(a==='next') move(1);
  else if(a==='submit') submit();
  else if(a==='clear'){ if(confirm('清除全部作答？')){ S.ans={}; render(); } }
  else if(a==='wipe'){ if(confirm('確定清空錯題本？')){ store.set(KEY_BOOK,{}); render(); } }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify({author:'阿森',book:store.get(KEY_BOOK,{}),hist:store.get(KEY_HIST,[])},null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob), x=document.createElement('a'); x.href=u; x.download='ipas-s3-成績檔.json'; x.click(); URL.revokeObjectURL(u);
  }
  else if(a==='import') document.getElementById('file').click();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='file'||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); store.set(KEY_BOOK,d.book||{}); store.set(KEY_HIST,d.hist||[]); alert('匯入完成'); render(); }catch(err){ alert('檔案格式不對，無法匯入'); } };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowLeft') move(-1);
  else if(e.key==='ArrowRight') move(1);
  else if('abcdABCD'.includes(e.key)&&e.key.length===1) pick('abcd'.indexOf(e.key.toLowerCase()));
});
render();
</script>
</body>
</html>
